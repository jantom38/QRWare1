server:
  address: 0.0.0.0

spring:
  application:
    name: qrware-warehouse-system

  profiles:
    active: prod
  
  jackson:
    serialization:
      fail-on-empty-beans: false

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/qrware_db
    username: qrware_user
    password: qrware_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Security
  security:
    require-ssl: false

  # Actuator
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: when-authorized

# JWT Configuration
jwt:
  secret: qrware-super-secret-key-change-in-production-min-512-bits
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# QR Code Configuration
qrcode:
  size: 300
  format: PNG
  error-correction: M

# File Storage Configuration
file:
  storage:
    upload-dir: uploads
    qr-code-dir: qr-codes
    max-file-size: 10485760 # 10MB
    allowed-extensions:
      - png
      - jpg
      - jpeg
      - svg

# Application Configuration
app:
  name: QRWare Warehouse Management System
  version: 1.0.0
  description: Advanced warehouse management with QR code technology
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080,http://10.0.2.2:8080"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging Configuration
logging:
  level:
    com.qrware: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/qrware.log

---

# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/qrware_dev;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  address: 0.0.0.0

jwt:
  secret: dev-secret-key-for-development-only

---

# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  security:
    require-ssl: true

logging:
  level:
    com.qrware: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
